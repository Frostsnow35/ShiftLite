name: AI PR Reviewer Note Check

# 校验「AI 参与的 PR」是否随 PR 提交了双语 HTML reviewer 说明。
# 规则见 docs/AI_POLICY.md 与 AGENTS.md。
# main 分支保护要求本检查（ai-pr-reviewer-note）通过才准合并。
# 判定「AI 参与」的条件：PR 模板勾选「AI 参与」 或 已附 reviews/PR-<编号>.html（二者其一）；
# 不强制人类手动勾选——AI Agent 按 AGENTS.md 自动产出说明即触发校验。
#
# 触发器保留 pull_request：pull_request_target 的 workflow 只从 base 默认分支读取，
# 在 PR 分支里换成它，本 PR 自身反而不会触发检查，必检项会一直挂着。
# 迁移 pull_request_target 需要在 main 上单独合入，属后续维护项。
# fork PR 的 GITHUB_TOKEN 只读，写评论必定失败，因此评论失败不判检查失败。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-pr-reviewer-note:
    name: ai-pr-reviewer-note
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate AI PR and reviewer note
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          STAMP="<!-- ai-note-check:${HEAD_SHA} -->"
          post_comment () {
            local body="$1"
            # 同一个 head sha 只留一条评论；评论写失败不能影响检查结论
            if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null \
               | grep -qF "$STAMP"; then
              echo "::notice::该 head sha 已有校验评论，跳过重复留言。"
              return 0
            fi
            printf '%s\n%s\n' "$body" "$STAMP" \
              | gh pr comment "${PR_NUMBER}" -R "${REPO}" --body-file - >/dev/null 2>&1 \
              || echo "::warning::发布校验评论失败，不影响本检查结果。"
          }

          NOTE_PATH="reviews/PR-${PR_NUMBER}.html"

          # 1) 判定是否 AI 参与 PR：勾选 或 已附说明文件，二者其一即触发
          ai_line=$(printf '%s' "$PR_BODY" | grep -F '<!-- ai-pr -->' || true)
          checkbox_checked=0
          if [ -n "$ai_line" ] && printf '%s' "$ai_line" | grep -qF '[x]'; then
            checkbox_checked=1
          fi

          note_exists=0
          if gh api "repos/${REPO}/contents/${NOTE_PATH}?ref=${HEAD_SHA}" >/dev/null 2>&1; then
            note_exists=1
          fi

          if [ "$checkbox_checked" = 0 ] && [ "$note_exists" = 0 ]; then
            echo "::notice::未检测到 AI 参与标记，也未附双语说明，视为非 AI PR，跳过校验。"
            exit 0
          fi
          echo "::notice::检测到 AI 参与 PR（勾选=${checkbox_checked} / 说明存在=${note_exists}），开始校验双语结构。"

          # 2) 必须存在 reviews/PR-<编号>.html
          if [ "$note_exists" = 0 ]; then
            body=$'❌ **缺少双语 HTML reviewer 说明 / Missing bilingual HTML reviewer note**\n\n本 PR 被识别为 AI 参与，按要求必须随 PR 提交：`reviews/PR-__PRNUM__.html`。\n模板见 `docs/reviewer-note.template.html`。该文件需同时包含中文与英文内容（概述 / AI 参与披露 / 验证 等小节）。\n\nEnglish: This PR is identified as AI-assisted. You must attach a bilingual HTML reviewer note at `reviews/PR-__PRNUM__.html` (template: `docs/reviewer-note.template.html`). The file must contain both Chinese and English content with key sections (Summary / AI Participation / Verification).\n\n合并已被分支保护阻止，请补充后重新推送。'
            body="$(printf '%s' "$body" | sed "s/__PRNUM__/${PR_NUMBER}/g")"
            post_comment "$body"
            echo "::error::缺少 ${NOTE_PATH}，合并被阻止。"
            exit 1
          fi

          # 3) 下载并校验双语结构（中英均有 + 含关键小节）
          html=$(gh api "repos/${REPO}/contents/${NOTE_PATH}?ref=${HEAD_SHA}" --jq '.content' | base64 -d)
          has_cjk=$(printf '%s' "$html" | grep -qP '[\x{4e00}-\x{9fff}]' && echo 1 || echo 0)
          has_en=$(printf '%s' "$html" | grep -qiE 'summary|verification|testing|review|disclosure|participation' && echo 1 || echo 0)
          has_zh_kw=$(printf '%s' "$html" | grep -qE '概述|摘要|披露|验证|测试|审阅|说明' && echo 1 || echo 0)
          echo "::notice::has_cjk=${has_cjk} has_en=${has_en} has_zh_kw=${has_zh_kw}"
          if [ "$has_cjk" = 0 ] || [ "$has_en" = 0 ] || [ "$has_zh_kw" = 0 ]; then
            body=$'❌ **双语 HTML reviewer 说明内容不合规 / Invalid bilingual reviewer note**\n\n文件 `reviews/PR-__PRNUM__.html` 已存在，但缺少必要的双语结构。要求：\n- 同时包含中文与英文；\n- 含关键小节（如 概述/Summary、AI 参与披露/AI Participation、验证/Verification）。\n\nEnglish: The note exists but lacks required bilingual structure (both Chinese and English, with key sections such as Summary / AI Participation / Verification).\n\n合并已被分支保护阻止，请补全后重新推送。'
            body="$(printf '%s' "$body" | sed "s/__PRNUM__/${PR_NUMBER}/g")"
            post_comment "$body"
            echo "::error::双语结构不完整，合并被阻止。"
            exit 1
          fi

          # 4) 拒绝把未改写的编写稿直接复制到编号路径（编号文件必须是正式说明）
          draft_marker=$(printf '%s' "$html" | grep -oiE 'reviewer note draft|审阅说明草稿|尚未创建 ?PR|不代替 AGENTS\.md|不替代 AGENTS\.md' | head -1 || true)
          if [ -n "$draft_marker" ]; then
            body=$'❌ **编号说明仍是编写稿 / Numbered note is still a draft**\n\n`reviews/PR-__PRNUM__.html` 中含有编写稿占位语句（__MARKER__）。请按模板 `docs/reviewer-note.template.html` 填写正式说明：写明 PR 编号、作者、日期、AI 工具与模型、参与范围、人工复核、验证与测试、已知问题，并删除编写稿声明。\n\nEnglish: The numbered note still contains draft placeholder text. Fill in the template with the PR number, author, date, AI tool/model, scope, human review, verification and known issues, and remove the draft disclaimer.'
            body="$(printf '%s' "$body" | sed "s/__PRNUM__/${PR_NUMBER}/g; s/__MARKER__/${draft_marker}/g")"
            post_comment "$body"
            echo "::error::${NOTE_PATH} 仍是编写稿，未填写正式编号说明。"
            exit 1
          fi

          body=$'✅ **双语 HTML reviewer 说明校验通过 / Bilingual reviewer note verified**\n\n已确认 `reviews/PR-__PRNUM__.html` 存在且含中英双语必要小节。可继续评审。\n\nEnglish: `reviews/PR-__PRNUM__.html` is present and contains the required bilingual sections. Review may proceed.'
          body="$(printf '%s' "$body" | sed "s/__PRNUM__/${PR_NUMBER}/g")"
          post_comment "$body"
